<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Hitung Tunggakan Bulanan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="month"], input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Pembayaran BPJS Perisai</h2>
    
    <div class="form-group">
        <label for="bulanMasuk">Bulan Masuk:</label>
        <input type="month" id="bulanMasuk" oninput="hitungTunggakan()">
    </div>
    
    <div class="form-group">
        <label for="sudahBayar">Sudah Bayar (Bulan):</label>
        <input type="number" id="sudahBayar" min="0" value="0" oninput="hitungTunggakan()">
    </div>
    
    <div class="form-group">
        <label for="sampaiBulan">Sampai Bulan:</label>
        <input type="text" id="sampaiBulan" readonly placeholder="-">
    </div>
    
    <div class="form-group">
        <label for="tunggak">Tunggak:</label>
        <input type="text" id="tunggak" readonly placeholder="-">
    </div>
</div>

<script>
    function hitungTunggakan() {
        const inputBulanMasuk = document.getElementById('bulanMasuk').value;
        const sudahBayar = parseInt(document.getElementById('sudahBayar').value) || 0;
        
        const labelSampaiBulan = document.getElementById('sampaiBulan');
        const labelTunggak = document.getElementById('tunggak');
        
        // Validasi jika bulan masuk belum diisi
        if (!inputBulanMasuk) {
            labelSampaiBulan.value = "-";
            labelTunggak.value = "-";
            return;
        }
        
        // Opsi format cetak nama bulan (Indonesia)
        const opsiFormat = { month: 'long', year: 'numeric' };
        
        // Memecah nilai input (format: YYYY-MM)
        const [tahunMasuk, indexBulanMasuk] = inputBulanMasuk.split('-').map(Number);
        
        // 1. MENGHITUNG "SAMPAI BULAN"
        if (sudahBayar > 0) {
            // Membuat objek tanggal berdasarkan bulan masuk
            let tanggalSampai = new Date(tahunMasuk, indexBulanMasuk - 1);
            // Ditambah (sudahBayar - 1) karena bulan masuk dihitung sebagai bulan pertama
            tanggalSampai.setMonth(tanggalSampai.getMonth() + (sudahBayar - 1));
            
            labelSampaiBulan.value = tanggalSampai.toLocaleDateString('id-ID', opsiFormat);
        } else {
            // Jika belum bayar sama sekali (0)
            labelSampaiBulan.value = "Belum ada pembayaran";
        }
        
        // 2. MENGHITUNG "TUNGGAKAN" (Berdasarkan bulan berjalan saat ini: Oktober 2026)
        const tanggalSekarang = new Date(); 
        const tahunSekarang = tanggalSekarang.getFullYear();
        const bulanSekarang = tanggalSekarang.getMonth();
        
        // Hitung total bulan kewajiban dari Bulan Masuk sampai Bulan Sekarang
        const totalBulanHarusBayar = ((tahunSekarang - tahunMasuk) * 12) + (bulanSekarang - (indexBulanMasuk - 1)) + 1;
        
        // Tunggakan = total bulan kewajiban dikurangi yang sudah dibayar
        let sisaTunggakan = totalBulanHarusBayar - sudahBayar;
        
        // Jika hasil minus (artinya sudah lunas / bayar lebih awal), set menjadi 0
        if (sisaTunggakan < 0) {
            sisaTunggakan = 0;
        }
        
        labelTunggak.value = sisaTunggakan + " kali";
    }
</script>

</body>
</html>
